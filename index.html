<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Amine Coffee — Menu</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>

<body>

  <!-- ===== Header ===== -->
  <header class="site-header">
    <div class="header-inner">
      <div class="logo">
        <img src="images/logo360360.png" alt="Amine Coffee Logo">
      </div>
      <div class="brand">
        <h1>Amine Coffee</h1>
        <p class="tagline">Fresh taste every day</p>
      </div>
    </div>
  </header>

  <!-- ===== Slider Section ===== -->
  <section class="slider">
    <div class="slides">
      <div class="slide fade">
        <img src="images/p1.png" alt="Espresso Delight">
      </div>
      <div class="slide fade">
        <img src="images/p21.png" alt="Latte Love">
      </div>
      <div class="slide fade">
        <img src="images/p2.png" alt="Cappuccino Aroma">
      </div>
    </div>
    <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
    <a class="next" onclick="plusSlides(1)">&#10095;</a>
  </section>

  <!-- ===== Main Menu Layout ===== -->
  <main class="menu-container">
    <nav class="categories" id="categories"></nav>
    <section class="menu-section" id="menu-section"></section>
  </main>

  <!-- ===== Popup (Drink details) ===== -->
  <div class="popup" id="drinkPopup">
    <div class="popup-content">
      <span class="close">&times;</span>
      <img id="popupImg" src="" alt="Drink image">
      <h3 id="popupTitle">Drink Name</h3>
      <p id="popupPrice">6 RMB</p>

      <div class="sugar-options">
        <input type="radio" id="no-sugar" name="sugar" value="No Sugar">
        <label for="no-sugar">No Sugar</label>

        <input type="radio" id="less-sugar" name="sugar" value="Less Sugar">
        <label for="less-sugar">Less</label>

        <input type="radio" id="normal-sugar" name="sugar" value="Normal Sugar" checked>
        <label for="normal-sugar">Normal</label>

        <input type="radio" id="extra-sugar" name="sugar" value="Extra Sugar">
        <label for="extra-sugar">Extra</label>
      </div>

      <div id="drinkDesc" class="drink-desc"></div>

      <!-- WhatsApp button with icon -->
      <a href="#" class="btn-order" id="waLink">
        <i class="fab fa-whatsapp"></i><span> 💬 Order via WhatsApp 💚</span>
      </a>
    </div>
  </div>

  <!-- ===== Scripts ===== -->
  <script src="script.js"></script>
</body>
</html>
